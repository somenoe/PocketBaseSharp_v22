<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Flowbite/flowbite.min.css" />
    <link rel="stylesheet" href="css/app.min.css" />
    <script type="importmap"></script>
    <script>
      if (
        localStorage.getItem("color-theme") === "dark" ||
        (!("color-theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      const demoAuthStorageKey = "pocketbasesharp.demo.auth";

      window.demoAuthStore = {
        load() {
          try {
            const raw = localStorage.getItem(demoAuthStorageKey);
            return raw ? JSON.parse(raw) : null;
          } catch {
            localStorage.removeItem(demoAuthStorageKey);
            return null;
          }
        },
        save(value) {
          if (!value) {
            localStorage.removeItem(demoAuthStorageKey);
            return;
          }

          localStorage.setItem(demoAuthStorageKey, JSON.stringify(value));
        },
        clear() {
          localStorage.removeItem(demoAuthStorageKey);
        },
      };
    </script>
  </head>

  <body
    class="min-h-screen overflow-x-hidden antialiased font-sans text-slate-900 bg-[linear-gradient(180deg,#fff7ed_0%,#f8fafc_42%,#eef2ff_100%)] dark:text-slate-100 dark:bg-[linear-gradient(180deg,#0f172a_0%,#020617_100%)]"
  >
    <div id="app">
      <svg class="absolute left-1/2 top-[20vh] block h-32 w-32 -translate-x-1/2" aria-hidden="true">
        <circle
          class="fill-none stroke-orange-200 [stroke-width:0.6rem] [transform:rotate(-90deg)] [transform-origin:50%_50%]"
          r="40%"
          cx="50%"
          cy="50%"
        />
        <circle
          class="fill-none stroke-orange-600 [stroke-width:0.6rem] [transform:rotate(-90deg)] [transform-origin:50%_50%] [stroke-dasharray:calc(3.141*var(--blazor-load-percentage,0%)_*_0.8),500%] [transition:stroke-dasharray_0.05s_ease-in-out]"
          r="40%"
          cx="50%"
          cy="50%"
        />
      </svg>
      <div
        class="absolute inset-x-0 top-[calc(20vh+3.25rem)] text-center font-['Space_Grotesk','Segoe_UI',sans-serif] text-[0.95rem] font-semibold text-orange-800 dark:text-orange-300"
      >
        Booting demo...
      </div>
    </div>

    <div
      id="blazor-error-ui"
      class="fixed inset-x-0 bottom-0 z-[1000] hidden box-border bg-yellow-100 px-5 py-3 pr-12 text-slate-900 shadow-[0_-1px_2px_rgba(0,0,0,0.2)]"
    >
      An unhandled error has occurred.
      <a href="." class="reload font-semibold underline decoration-orange-400 underline-offset-4"
        >Reload</a
      >
      <span class="dismiss absolute right-3 top-2 cursor-pointer select-none">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.9"></script>
    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.13"></script>
    <script src="_content/Flowbite/flowbite.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
